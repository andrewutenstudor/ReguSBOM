apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbom-validator.backend.fullname" . }}
  labels:
    {{- include "sbom-validator.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "sbom-validator.backend.selectorLabels" . | nindent 4 }}
