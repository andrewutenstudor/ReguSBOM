name: ReguBOM CE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-cli:
    name: Backend Lint & CLI Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & Linters
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Run Ruff Lint
        run: |
          ruff check backend/app backend/cli --ignore E501,E402,E722

      - name: Run Headless CLI Offline Scan
        run: |
          python backend/cli/regubom_cli.py scan backend/sample_ce_sbom.json

  frontend-build:
    name: Frontend CE Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build Frontend (Community Edition)
        working-directory: frontend
        env:
          VITE_REGUBOM_EDITION: community
          VITE_EDITION: ce
        run: npm run build

  ce-docker-integration:
    name: CE Docker Stack & API Integration
    runs-on: ubuntu-latest
    needs: [backend-lint-and-cli, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and Start CE Docker Containers
        run: |
          docker compose -f docker-compose.ce.yml up -d --build

      - name: Wait for ReguBOM CE Backend Health
        run: |
          echo "Waiting for ReguBOM CE backend to be healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "healthy"; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 2
          done

      - name: Execute ReguBOM CLI Scan against Gateway API
        run: |
          python backend/cli/regubom_cli.py scan backend/sample_ce_sbom.json --api-url http://localhost:8000

      - name: Tear Down Docker Stack
        if: always()
        run: |
          docker compose -f docker-compose.ce.yml down -v
