apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sbom-validator.frontend.fullname" . }}-nginx
  labels:
    {{- include "sbom-validator.frontend.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name {{ .Values.domain }} localhost;
        client_max_body_size {{ .Values.backend.env.MAX_FILE_SIZE_MB | default 500 }}M;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to backend service
        location /api/ {
            proxy_pass http://{{ include "sbom-validator.backend.fullname" . }}:{{ .Values.backend.service.port }}/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
