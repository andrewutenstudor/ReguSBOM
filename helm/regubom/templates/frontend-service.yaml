apiVersion: v1
kind: Service
metadata:
  name: {{ include "regubom.frontend.fullname" . }}
  labels:
    {{- include "regubom.frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port | default 80 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "regubom.frontend.selectorLabels" . | nindent 4 }}
