{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "regubom.fullname" . }}
  labels:
    {{- include "regubom.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: regubom
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic within the regubom namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: regubom
    # Allow ingress controller traffic to frontend and backend services
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: {{ .Values.frontend.containerPort | default 8080 }}
  egress:
    # Allow communication between regubom components (frontend -> backend, backend -> postgresql)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: regubom
    # Allow internal DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
