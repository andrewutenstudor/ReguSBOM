{{- if and (not .Values.backend.secrets.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "regubom.secretName" . }}
  labels:
    {{- include "regubom.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ .Values.backend.secrets.jwtSecretKey | quote }}
  JWT_ALGORITHM: {{ .Values.backend.secrets.jwtAlgorithm | quote }}
  JWT_EXPIRE_MINUTES: {{ .Values.backend.secrets.jwtExpireMinutes | quote }}
{{- end }}
---
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "regubom.dbSecretName" . }}
  labels:
    {{- include "regubom.postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}
{{- end }}
